name: Fix formatting

env:
  PNPM_VERSION: "10.28.1"
  NODE_VERSION: "24.11.0"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request_target:
    types: [labeled]

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'format'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name}}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install
        run: pnpm install --ignore-scripts

      - name: Get changed files and write to temp
        id: get-changed-files
        uses: actions/github-script@v9
        with:
          script: |
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              }
            );
            const files = changedFiles.filter(file=> file.status !== "removed").map(file => file.filename);
            if (files.length > 0) {
              require('fs').writeFileSync('/tmp/changed-files.txt', files.join('\0'));
              core.setOutput('has-files', 'true');
            }

      - name: Fix formatting
        if: steps.get-changed-files.outputs.has-files == 'true'
        run: |
          xargs -0 pnpm oxfmt --no-error-on-unmatched-pattern < /tmp/changed-files.txt

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix formatting"

      - name: Remove label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: format
