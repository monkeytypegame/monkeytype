<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 Not Found | Monkeytype</title>

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <meta name="name" content="Monkeytype" />
    <meta name="author" content="Miodec" />
    <meta
      name="description"
      content="The most customizable typing test website with a minimal design and a ton of features."
    />
    <meta name="theme-color" content="#e2b714" id="metaThemeColor" />

    <meta property="og:title" content="404 Not Found | Monkeytype" />
    <meta property="og:url" content="https://monkeytype.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Looks like this page doesn't exist."
    />
    <meta property="og:image" content="https://monkeytype.com/mtsocial.png" />

    <meta name="twitter:title" content="404 Not Found | Monkeytype" />
    <meta name="twitter:image" content="https://monkeytype.com/mtsocial.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* ---------- layout ---------- */
      .page404 {
        min-height: calc(100vh - 100px);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        box-sizing: border-box;
      }

      .page404 .content {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(260px, 1fr);
        align-items: center;
        gap: clamp(2rem, 6vw, 5rem);
      }

      /* ---------- image ---------- */
      .page404 .image {
        width: 100%;
        aspect-ratio: 300 / 199;
        background: url("/images/monkeymeme.jpg") center / cover no-repeat;
        border-radius: var(--roundness);
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.12);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .page404 .image:hover {
        transform: translateY(-4px);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.18);
      }

      /* ---------- text ---------- */
      .page404 .side {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.25rem;
      }

      .page404 .title {
        margin: 0;
        font-size: clamp(5rem, 10vw, 8rem);
        line-height: 0.8;
        font-weight: 700;
        letter-spacing: -0.08em;
        color: var(--main-color);
        user-select: none;
      }

      .page404 .message {
        margin: 0;
        max-width: 430px;
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--sub-color);
      }

      .page404 .message strong {
        color: var(--text-color);
        font-weight: 500;
      }

      /* ---------- typing prompt (keyboard only) ---------- */
      .page404 .typing {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 1rem 1.25rem;
        border-radius: var(--roundness);
        background: var(--sub-alt-color);
        cursor: text;
      }

      .page404 .typing .words {
        font-size: 1.6rem;
        line-height: 1.3;
        letter-spacing: 0.02em;
        color: var(--sub-color);
        white-space: pre;
        user-select: none;
      }

      .page404 .typing .words span {
        position: relative;
      }

      .page404 .typing .words .correct {
        color: var(--text-color);
      }

      .page404 .typing .words .wrong {
        color: var(--error-color, #ca4754);
      }

      .page404 .typing .words .current::before {
        content: "";
        position: absolute;
        left: -1px;
        top: 0.1em;
        bottom: 0.1em;
        width: 2px;
        border-radius: 1px;
        background: var(--caret-color, var(--main-color));
        animation: caretBlink 1s steps(1) infinite;
      }

      .page404 .typing .hint {
        font-size: 0.85rem;
        color: var(--sub-color);
      }

      @keyframes caretBlink {
        50% {
          opacity: 0;
        }
      }

      /* touch devices have no keyboard to type with */
      @media (hover: none) {
        .page404 .typing {
          display: none;
        }
      }

      /* ---------- home button ---------- */
      .page404 .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding: 0.9rem 1.4rem;
        border-radius: var(--roundness);
        background: var(--sub-alt-color);
        color: var(--text-color);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease;
      }

      .page404 .button i {
        font-size: 0.9em;
      }

      .page404 .button:hover,
      .page404 .button:focus-visible {
        background: var(--text-color);
        color: var(--bg-color);
        transform: translateY(-2px);
      }

      .page404 .button:focus-visible {
        outline: 2px solid var(--main-color);
        outline-offset: 3px;
      }

      .page404 .button:active {
        transform: translateY(0);
      }

      /* ---------- logo ---------- */
      header #logo .icon svg path {
        fill: var(--sub-color);
      }

      header #logo {
        transition: opacity 0.2s ease;
      }

      header #logo:hover {
        opacity: 0.8;
      }

      /* ---------- mobile ---------- */
      @media (max-width: 700px) {
        .page404 {
          min-height: calc(100vh - 80px);
          padding: 2rem 1.25rem 4rem;
        }

        .page404 .content {
          grid-template-columns: 1fr;
          gap: 2rem;
          max-width: 420px;
        }

        .page404 .side {
          align-items: center;
          text-align: center;
        }

        .page404 .title {
          font-size: 6rem;
        }

        .page404 .message {
          font-size: 1rem;
        }

        .page404 .button {
          min-width: 150px;
        }
      }

      @media (max-width: 400px) {
        .page404 .title {
          font-size: 5rem;
        }
      }

      /* ---------- reduced motion ---------- */
      @media (prefers-reduced-motion: reduce) {
        .page404 .image,
        .page404 .button,
        header #logo {
          transition: none;
        }

        .page404 .image:hover,
        .page404 .button:hover,
        .page404 .button:focus-visible {
          transform: none;
        }

        .page404 .typing .words .current::before {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <script type="module">
      import { loadCSS } from "./ts/utils/misc";

      loadCSS("/css/fa.min.css", true);

      document.getElementById("page404")?.classList.remove("hidden");
      document.querySelector("header")?.classList.add("focus");
      document.title = "404 Not Found | Monkeytype";

      // Typing prompt: type the phrase to go home. The button still works.
      const phrase = "go home";
      const words = document.getElementById("words");

      if (words) {
        const chars = [...phrase].map((ch) => {
          const el = document.createElement("span");
          el.textContent = ch;
          words.appendChild(el);
          return el;
        });

        let index = 0;
        chars[0].classList.add("current");

        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;

          e.preventDefault();
          const current = chars[index];

          if (e.key.toLowerCase() === phrase[index]) {
            current.classList.remove("current", "wrong");
            current.classList.add("correct");
            index++;

            if (index === chars.length) {
              window.location.href = "/";
              return;
            }
            chars[index].classList.add("current");
          } else {
            current.classList.add("wrong");
            setTimeout(() => current.classList.remove("wrong"), 200);
          }
        });
      }
    </script>

      <main style="height: 100%">
        <div class="page page404 hidden" id="page404">
          <div class="content">
            <div class="image" role="img" aria-label="Confused monkey"></div>

            <div class="side">
              <h2 class="title">404</h2>

              <p class="message">
